# =============================================================================
# model_config.yaml  —  Alert Triage & Prioritization (SOC #01, P0)
#                       CSE-CIC-IDS2018 / CICIDS2017 · LightGBM · NATIVE-only
# Public NetFlow benchmark variant of slot #01. No magic numbers in code
# (instruction §5) — everything src/ needs is here, in feature_config.yaml or
# in serving_config.yaml.
# Plan: plan/01_P0_Alert_Triage.md  (§2 framing, §5 protocol, §8 acceptance)
# =============================================================================
seed: 42

data:
  # Merged NetFlow table built by data/build_ids2018_dataset.py. Slot-relative;
  # resolved at run time by src/data_source.py (never a hardcoded absolute path).
  dir: data
  dataset: ids2018_merged.parquet            # the table the model trains on
  manifest: ids2018_feature_manifest.json    # native feature list + label map
  selected: native_selected.json             # leak/noise-screened model features
  screen_audit: feature_screen.csv           # full per-feature screen audit
  # Second benchmark kept alongside for cross-dataset work (not trained on here).
  alt_dataset: cicids2017_merged.parquet
  alt_manifest: cicids2017_feature_manifest.json

# Target: y_is_attack (BENIGN=0, any attack=1). The model's attack probability IS
# the triage score; attack_class is carried for per-scenario evaluation only and
# is NEVER a feature.
target: y_is_attack
attack_class_column: attack_class

split:
  # Random stratified 70/30. NOT temporal: the grain is an independent NetFlow
  # record (no per-entity time series to leak across a cut), and the 2018 capture
  # runs attack campaigns day-by-day — a temporal cut would put whole attack
  # classes entirely on one side and make the test unrepresentative.
  test_frac: 0.30
  stratify: true

lgbm_classifier:                 # the single supervised model (X = native features)
  objective: binary
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 200
  subsample: 0.85
  subsample_freq: 1
  colsample_bytree: 0.9
  reg_lambda: 1.0
  deterministic: true            # reproducible fit (paired with force_row_wise)
  force_row_wise: true
  n_jobs: -1
  verbose: -1
  # scale_pos_weight = neg/pos computed at fit time (imbalance handling — required).

operating_point:
  # Pick the highest-recall threshold that still holds precision >= this floor,
  # rather than a fixed 0.50 — the analyst queue is precision-constrained.
  min_precision: 0.70
  fallback_threshold: 0.50       # used when no threshold reaches the floor

priority:
  # Graded 0-100 priority over PREDICTED ALERTS ONLY (normal flows are not
  # ranked): a blend of model confidence and traffic volume, both as percentile
  # ranks so the two scales stay comparable.
  weights:
    probability: 0.70
    volume: 0.30
  volume_feature_preference: [IN_BYTES, BYTE, LENGTH, PKT]   # first match wins
  log1p_volume: true
  n_deciles: 10

explainability:
  # LightGBM native pred_contrib (exact tree SHAP) — no extra `shap` dependency.
  shap_sample_rows: 6000
  local_example: highest_scoring   # which test row the SHAP-local chart explains

# Gates below are set with headroom against the verified reference run
# (ROC 0.9922 · PR 0.9864 · precision 0.7003 · FN 1.79% · gap 0.0022 ·
# reduction 68.6%), so a real regression trips them but run-to-run noise does not.
acceptance:                      # plan §8 gates (enforced in tests/)
  roc_auc_min: 0.95
  pr_auc_min: 0.90
  fn_rate_max: 0.050             # miss <=5% of true attacks at the operating point
  precision_min: 0.70            # must hold the operating_point floor
  roc_gap_max: 0.050             # train-vs-test ROC gap ceiling (overfit guard)
  alert_reduction_min: 0.50      # >=50% of flows suppressed as NORMAL
