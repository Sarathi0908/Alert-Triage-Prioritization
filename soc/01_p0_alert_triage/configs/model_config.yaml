# =============================================================================
# model_config.yaml  —  Alert Triage & Prioritization (SOC #01, P0)
#                       CSE-CIC-IDS2018 / CICIDS2017 · LightGBM · NATIVE-only
# Public NetFlow benchmark variant of slot #01. No magic numbers in code
# (instruction §5) — everything src/ needs is here, in feature_config.yaml or
# in serving_config.yaml.
# Plan: plan/01_P0_Alert_Triage.md  (§2 framing, §5 protocol, §8 acceptance)
# =============================================================================
seed: 42

data:
  # Merged NetFlow table built by data/build_ids2018_dataset.py. Slot-relative;
  # resolved at run time by src/data_source.py (never a hardcoded absolute path).
  dir: data
  dataset: ids2018_merged.parquet            # the table the model trains on
  manifest: ids2018_feature_manifest.json    # native feature list + label map
  selected: native_selected.json             # leak/noise-screened model features
  screen_audit: feature_screen.csv           # full per-feature screen audit
# Alternative dataset profiles. `py src/pipeline.py --dataset cicids2017` overlays
# the named profile onto `data` above and writes to its own `outputs` dir, so the
# two benchmarks never overwrite each other's artefacts.
dataset_profiles:
  cicids2017:
    outputs: outputs_cicids2017
    data:
      # Built by data/build_cicids2017_raw.py (stage 1, verbatim) then
      # data/build_cicids2017_flattened.py (stage 2, EDA -> model-ready X/Y).
      dir: data
      raw: cicids2017_raw.parquet
      raw_manifest: cicids2017_raw_manifest.json
      dataset: cicids2017_flattened.parquet
      manifest: cicids2017_flattened_manifest.json
      selected: cicids2017_native_selected.json
      screen_audit: cicids2017_feature_screen.csv
      provenance: cicids2017_feature_provenance.csv
    operating_point:
      # CICIDS2017 is far more separable than the 2018 NetFlow set, so the 0.70
      # floor above is the wrong instrument here: measured on the held-out split it
      # buys 639 extra true positives at the cost of 53,719 extra false positives.
      #   floor 0.70 -> precision 0.700, recall 1.0000,     1 FN, 54,753 FP
      #   floor 0.95 -> precision 0.951, recall 0.9999,     7 FN,  6,645 FP
      #   floor 0.99 -> precision 0.992, recall 0.9950,   640 FN,  1,034 FP
      # 0.95 keeps the near-zero miss rate while cutting the analyst queue ~8x.
      min_precision: 0.95
    eda:
      # CIC's own column naming; the 2018 NetFlow set calls this L4_DST_PORT.
      port_column: Destination Port
    screen:
      # Top-18 feature policy for the CICIDS2017 benchmark: the floor no longer
      # trims the tail (0.0); instead the strongest 18 screen survivors are kept.
      # NOTE apply_dataset_profile patches shallowly, so this balance block must
      # carry EVERY key the screener reads, not only the ones that change.
      balance:
        gain_cap_pct: 45.0
        gain_floor_pct: 0.0
        max_dominant_drops: 2
        min_pool_size: 8
        min_selected: 18
        max_selected: 18

# Target: y_is_attack (BENIGN=0, any attack=1). The model's attack probability IS
# the triage score; attack_class is carried for per-scenario evaluation only and
# is NEVER a feature.
target: y_is_attack
attack_class_column: attack_class

split:
  # Random stratified 70/30. NOT temporal: the grain is an independent NetFlow
  # record (no per-entity time series to leak across a cut), and the 2018 capture
  # runs attack campaigns day-by-day — a temporal cut would put whole attack
  # classes entirely on one side and make the test unrepresentative.
  test_frac: 0.30
  stratify: true

lgbm_classifier:                 # the single supervised model (X = native features)
  objective: binary
  n_estimators: 400
  learning_rate: 0.05
  num_leaves: 63
  min_child_samples: 200
  subsample: 0.85
  subsample_freq: 1
  colsample_bytree: 0.9
  reg_lambda: 1.0
  deterministic: true            # reproducible fit (paired with force_row_wise)
  force_row_wise: true
  n_jobs: -1
  verbose: -1
  # scale_pos_weight = neg/pos computed at fit time (imbalance handling — required).

operating_point:
  # Pick the highest-recall threshold that still holds precision >= this floor,
  # rather than a fixed 0.50 — the analyst queue is precision-constrained.
  min_precision: 0.70
  fallback_threshold: 0.50       # used when no threshold reaches the floor

priority:
  # Graded 0-100 priority over PREDICTED ALERTS ONLY (normal flows are not
  # ranked): a blend of model confidence and traffic volume, both as percentile
  # ranks so the two scales stay comparable.
  weights:
    probability: 0.70
    volume: 0.30
  volume_feature_preference: [IN_BYTES, BYTE, LENGTH, PKT]   # first match wins
  log1p_volume: true
  n_deciles: 10

explainability:
  # LightGBM native pred_contrib (exact tree SHAP) — no extra `shap` dependency.
  shap_sample_rows: 6000
  local_example: highest_scoring   # which test row the SHAP-local chart explains

# Gates below are set with headroom against the verified reference run
# (ROC 0.9922 · PR 0.9864 · precision 0.7003 · FN 1.79% · gap 0.0022 ·
# reduction 68.6%), so a real regression trips them but run-to-run noise does not.
acceptance:                      # plan §8 gates (enforced in tests/)
  roc_auc_min: 0.95
  pr_auc_min: 0.90
  fn_rate_max: 0.050             # miss <=5% of true attacks at the operating point
  precision_min: 0.70            # must hold the operating_point floor
  roc_gap_max: 0.050             # train-vs-test ROC gap ceiling (overfit guard)
  alert_reduction_min: 0.50      # >=50% of flows suppressed as NORMAL
  # Analyst-workload ceiling. NOTE this is precision re-expressed as workload, not
  # an independent signal: with a fixed triage cost it equals (1-precision)*60/mins,
  # so at 5 min/alert it can never exceed 12 and a ceiling above that is vacuous.
  # 4.0 binds at precision >= ~0.667, just under the 0.70 floor the threshold holds.
  fp_per_analyst_hour_max: 4.0
  # A healthy aggregate can hide one attack class the model never catches, so the
  # weakest class carries its own floor (src/evaluation/attack_class_evaluator.py).
  min_recall_any_class: 0.50
