# =============================================================================
# Pipeline contract for  soc/01_p0_alert_triage  (Alert-Triage-Prioritization)
#
# WHERE THIS FILE BELONGS
# Copy it to the model repo, at the root of the model folder:
#   Alert-Triage-Prioritization/soc/01_p0_alert_triage/pipeline.yaml
# It must ship WITH the commit, so the declaration can never disagree with the
# code it describes. A copy is kept here only so the contract is reviewable
# alongside the platform that consumes it.
#
# WHY THIS FILE EXISTS AT ALL
# The platform's current discovery looks for `soc/<x>/src/train/train.py`
# (catalog/model_project_store.py:1189). This model has `src/pipeline.py`, so
# discovery finds ZERO projects and says nothing about why. Declaring the
# entry points removes the guessing.
# =============================================================================
apiVersion: mlplatform/v1
kind: ModelPipeline

metadata:
  model_key: alert_triage_netflow
  name: Alert Triage & Prioritization (CSE-CIC-IDS2018 NetFlow)
  owner_email: soc-ml@finstein.ai
  workstream_key: pre_agent_triage

runtime:
  # Pin by DIGEST before this runs in anger. A tag is mutable; "same commit,
  # same model" cannot hold behind a tag.
  image: ml-platform/model-runtime:py312@sha256:REPLACE_ME
  requirements: requirements.txt
  python: "3.12"

# -----------------------------------------------------------------------------
# inputs — the platform resolves the dataset version and puts the BYTES on disk,
# already sha256-verified, before either step starts. The model never resolves
# an id, never downloads, never holds a database credential.
#
# The autoloader publishes this key from soc_raw.v_netflow_training.
# -----------------------------------------------------------------------------
inputs:
  training_data:
    dataset_key: dataset.finstein.netflow_alerts
    version: pinned_at_dispatch
    format: parquet
    # Fail closed if the source drifts. These are the model's real contract:
    # 39 native features + the target + the class column, from
    # data/ids2018_feature_manifest.json.
    required_columns:
      - y_is_attack
      - attack_class
      - L4_DST_PORT
      - PROTOCOL
      - IN_BYTES
      - IN_PKTS
      - OUT_BYTES
      - OUT_PKTS
      - FLOW_DURATION_MILLISECONDS

params:
  seed:
    type: int
    default: 42
    immutable_for_reproducibility: true
  min_precision:
    type: float
    default: 0.70
    min: 0.0
    max: 1.0
  screen_sample_rows:
    type: int
    default: 200000
    min: 10000

# -----------------------------------------------------------------------------
# data_preparation — how the platform readies THIS model's data before
# extraction: the flatten that turns the client's raw table into the model's
# feature table. Declared here (the rename map the config names is CIC-specific
# knowledge that belongs with the model), so the auto-created refresh policy
# arrives pre-filled — no operator re-types platform plumbing in a UI.
# `env` maps subprocess env vars to server env var NAMES — never values.
# -----------------------------------------------------------------------------
data_preparation:
  command:
    - python
    - pipelines/steps/run_eda_sql.py
    - --config
    - pipelines/examples/postgres-pipeline.yaml
  timeout_s: 2700
  env:
    ML_SOURCE_DSN: ML_TRANSFORM_DSN
    ML_TARGET_DSN: ML_TRANSFORM_DSN
  # STRUCTURE ONLY — table NAMES, validated as plain SQL identifiers. The
  # platform pre-fills the source wizard from this block and verifies every
  # listed table exists before any run; the flatten config above is what
  # actually reads (and, for multi-table models, joins) them. `connection`
  # NAMES the server-side env var holding the DSN — the credential_ref
  # contract; a literal DSN here would put a secret in git and is refused.
  # Single-table today; `tables` accepts 1..N. `watermark_table` defaults to
  # the first table — the ONE relation the 10% new-data trigger measures.
  source:
    connection: SOURCE_DB_DSN
    schema: soc_raw
    tables: [cicids2017_flows]
    watermark_column: event_id
  flattened:
    schema: ml_processed
    table: alert_triage_features
  training_parameters:
    dataset: cicids2017

# -----------------------------------------------------------------------------
# steps — EDA first, then train. Order comes from `needs`, not from list
# position, and `train` provably cannot run unless `eda` exited 0 and produced
# every output declared `required: true`.
#
# This split mirrors what the model already does internally: run_screen() writes
# native_selected.json, and run_training(skip_screen=True) reuses it
# (src/pipeline.py:63, :323). The wrappers under pipeline/steps/ expose those
# two halves as separate entry points without changing the model's own logic.
# -----------------------------------------------------------------------------
steps:

  - id: eda
    entrypoint: ["python", "pipeline/steps/run_eda.py"]
    needs: []
    inputs:
      data: input://training_data
    outputs:
      selected_features:
        path: native_selected.json
        type: schema
        required: true
      screen_audit:
        path: feature_screen.csv
        type: profile
        required: true
      eda_summary:
        path: eda/eda_summary.json
        type: profile
        required: true
      column_profile:
        path: eda/column_profile.csv
        type: profile
        required: true
      # The drift baseline. This is the artifact the platform is currently
      # missing entirely: monitoring computes PSI against a ROLLING window
      # (monitoring/monitor/daily.py:722-723), so it measures "this week vs
      # last week" and can never see a model drifting away from the
      # distribution it was actually trained on. Persisting a training-time
      # baseline is what makes the drift retraining trigger mean something.
      drift_baseline:
        path: eda/drift_baseline.json
        type: drift_baseline
        required: true
    params: [seed, screen_sample_rows]
    resources: {cpu: "4", memory: 16Gi}
    timeout: 45m
    retries: {max: 1, backoff: 30s}
    cache: true

  - id: train
    entrypoint: ["python", "pipeline/steps/run_train.py"]
    needs: [eda]
    inputs:
      data:     input://training_data
      selected: step://eda/selected_features
      baseline: step://eda/drift_baseline
    outputs:
      model:
        path: lgbm_model.pkl
        type: model
        required: true
      metrics:
        path: metrics.json
        type: metrics
        required: true
      per_class:
        path: per_class_metrics.csv
        type: report
        required: true
      scorecard:
        path: triage_scorecard.md
        type: model_card
        required: true
    params: [seed, min_precision]
    resources: {cpu: "8", memory: 32Gi}
    timeout: 3h
    # Zero, deliberately. A retried fit is a DIFFERENT model registered under
    # the same job id — the one thing that quietly destroys lineage.
    retries: {max: 0}
    cache: true

# -----------------------------------------------------------------------------
# retraining — declared here, enforced by the platform. Replaces the
# CATALOG_MODEL_PROJECT_BOOTSTRAP_* environment variables.
# -----------------------------------------------------------------------------
retraining:
  enabled: true
  triggers:
    - type: new_data
      # Fires when arrivals since the LAST SUCCESSFUL TRAINING reach 10% of the
      # row count at that training. Measured against the last *trained*
      # watermark, not the last refresh — otherwise ten nights of 3% each reset
      # the counter and the threshold is never reachable.
      new_row_ratio: 0.10
    - type: model_age
      max_days: 30
  guards:
    min_rows_for_first_train: 50000
    max_shrink_pct: 0.10          # a 10% row drop blocks: that is a truncate
    cooldown: 24h
    max_runs_per_day: 1
    max_concurrent: 1

# -----------------------------------------------------------------------------
# gates — the model's own acceptance floors, from configs/model_config.yaml.
# A repo may TIGHTEN the platform floors; it may never loosen them. Validated
# at registration.
#
# NOTE — this model's metrics.json does not yet emit the platform's gate
# vocabulary. It writes `recall`, `brier`, `pr_auc`; the gates read
# `recall_malicious`, `brier_score`, `pr_auc`, plus six it does not produce at
# all (overall_psi, p1_p2_missed, high_critical_suppressed, replay_passed,
# holdout_malicious, replay_agent_worthy). run_train.py emits the mapped names
# it CAN measure and OMITS the rest — omission blocks, which is the honest
# outcome, and is why `gate_profile` below is `model_acceptance` rather than
# the full triage gate.
# -----------------------------------------------------------------------------
gates:
  gate_profile: model_acceptance
  floors:
    roc_auc_min: 0.95
    pr_auc_min: 0.90
    precision_min: 0.70
    fn_rate_max: 0.050
    roc_gap_max: 0.050
    alert_reduction_min: 0.50
    min_recall_any_class: 0.50
